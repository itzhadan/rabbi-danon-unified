name: rabbi_danon
description: "הרב יוסף דנון – 3 דקות לכבוד שבת"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  webview_flutter_wkwebview: ^3.16.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

# App icon – generated by:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0f1a28"
  adaptive_icon_foreground: "assets/icon_fg.png"

# Launch screen – generated by:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0f1a28"
  image: assets/splash.png
  android_12:
    color: "#0f1a28"
    image: assets/splash.png
