# בונה את האפליקציה אוטומטית ב-GitHub בכל push לתיקיית app (או ידנית מלשונית Actions)
# Android: קובץ APK להתקנה ישירה
# iOS: IPA לא חתום — חותמים אחר כך בעצמכם
name: Build apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup.sh
      - run: flutter build apk --release --build-number=${GITHUB_RUN_NUMBER}
      - uses: actions/upload-artifact@v4
        with:
          name: rabbi-danon-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup.sh
      - run: flutter build ios --release --no-codesign --build-number=${GITHUB_RUN_NUMBER}
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry rabbi-danon-unsigned.ipa Payload && ls -lh rabbi-danon-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: rabbi-danon-ios-unsigned
          path: app/build/ipa/rabbi-danon-unsigned.ipa

  # שומר את הקבצים המוכנים בענף "builds" (כדי שאפשר יהיה להוריד אותם גם עם git)
  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Push files to "builds" branch
        run: |
          mkdir pub && cd pub
          find ../out -type f \( -name '*.apk' -o -name '*.ipa' \) -exec cp {} . \;
          mv app-release.apk rabbi-danon.apk 2>/dev/null || true
          ls -lh
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "Build #${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}" > README.txt
          git add -A && git commit -qm "Build #${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
